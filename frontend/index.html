<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assistência Técnica - Cadastro de Equipamentos</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Assistência Técnica</h1>
    <p>Gerenciamento de equipamentos recebidos</p>
  </header>

  <main>
    <section class="card">
      <h2 id="form-titulo">Cadastrar equipamento</h2>

      <form id="form-equipamento">
        <input type="hidden" id="id">

        <label for="nome">Nome do equipamento</label>
        <input type="text" id="nome" placeholder="Ex.: Notebook Lenovo" required>

        <label for="tipo">Tipo do equipamento</label>
        <input type="text" id="tipo" placeholder="Ex.: Notebook, Impressora, Monitor" required>

        <label for="marca">Marca</label>
        <input type="text" id="marca" placeholder="Ex.: Lenovo, HP, Canon" required>

        <label for="problema">Problema relatado</label>
        <textarea id="problema" rows="3" placeholder="Descreva o problema informado pelo cliente"></textarea>

        <label for="status">Status</label>
        <select id="status">
          <option value="Em análise">Em análise</option>
          <option value="Em manutenção">Em manutenção</option>
          <option value="Finalizado">Finalizado</option>
        </select>

        <div class="botoes">
          <button type="submit" id="btn-enviar">Cadastrar</button>
          <button type="button" id="btn-cancelar" class="secundario" hidden>Cancelar edição</button>
        </div>
      </form>

      <p id="mensagem" class="mensagem" role="status"></p>
    </section>

    <section class="card">
      <h2>Equipamentos cadastrados</h2>
      <table>
        <thead>
          <tr>
            <th>Id</th>
            <th>Nome</th>
            <th>Tipo</th>
            <th>Marca</th>
            <th>Problema</th>
            <th>Status</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="lista-equipamentos"></tbody>
      </table>
      <p id="lista-vazia" class="mensagem" hidden>Nenhum equipamento cadastrado.</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
